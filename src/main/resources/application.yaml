server:
  port: 8080

spring:
  # Load secrets (e.g. OPENAI_API_KEY) from a gitignored .env file if present
  config:
    import: optional:file:.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: guiSample
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  # Datasource (PostgreSQL) — shared by Spring AI pgvector and MyBatis mappers
  datasource:
    driver-class-name: org.postgresql.Driver
    jdbc-url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    maximum-pool-size: 12
    max-lifetime: 170000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embeddings:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


