server:
  port: 8080

spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: guiSample
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  # Datasource (PostgreSQL) — shared by Spring AI pgvector and MyBatis mappers
  datasource:
    driver-class-name: org.postgresql.Driver
    jdbc-url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    maximum-pool-size: 12
    max-lifetime: 170000
  ai:
    openai:
      api-key: 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
      chat:
        options:
          model: gpt-4o-mini
      embeddings:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


