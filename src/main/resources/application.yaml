server:
  port: 8080

spring:
  application:
    name: guiSample
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.0:3306/jihundb?serverTimezone=UTC&allowMultiQueries=true&characterEncoding=UTF-8&useSSL=false&verifyServerCertificate=false
    hikari:
      username: root
      password: 89888988
      maximum-pool-size: 12
      max-lifetime: 170000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: kr.co.jihun.guisample.vo
  configuration:
    map-underscore-to-camel-case: true
