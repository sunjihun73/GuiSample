server:
  port: 8080

spring:
  # Load secrets (e.g. OPENAI_API_KEY) from a gitignored .env file if present
  config:
    import: optional:file:.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: guiSample
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  # 파일 업로드(임베딩 인덱싱) 크기 제한 — plain text 한정, 대용량 가드
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Datasource (PostgreSQL) — shared by Spring AI pgvector and MyBatis mappers
  datasource:
    driver-class-name: org.postgresql.Driver
    jdbc-url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    maximum-pool-size: 12
    max-lifetime: 170000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
#          model: gpt-5-mini
          model: gpt-4o-mini
          stream-usage: true
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


