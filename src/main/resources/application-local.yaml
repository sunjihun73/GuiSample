server:
  port: 8080
  servlet:
    session:
      timeout: 60m
  forward-headers-strategy: framework  # nginx 뒤에 있으므로 필수

spring:
  # Load secrets (e.g. OPENAI_API_KEY) from a gitignored .env file if present
  config:
    import: optional:file:.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: guiSample
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  # 파일 업로드(임베딩 인덱싱) 크기 제한 — plain text 한정, 대용량 가드
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Datasource (PostgreSQL) — shared by Spring AI pgvector and MyBatis mappers
  datasource:
    driver-class-name: org.postgresql.Driver
    jdbc-url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    maximum-pool-size: 12
    max-lifetime: 170000
    # HNSW 탐색 폭. 기본 40 은 RagContextAdvisor 의 top-k(8) 대비 좁아 상위 문서를 놓친다.
    # pgvector 가 아직 로드되지 않은 세션에서도 placeholder GUC 로 허용되므로 커넥션 초기화에 안전하다.
    # 주의: 코퍼스가 작으면(2026-09-17 기준 318 청크) 플래너가 HNSW 대신 seq scan 을 고른다.
    #       그동안 이 설정은 무해한 no-op 이고, 데이터가 늘어 인덱스를 타기 시작하면 그때부터 효과가 난다.
    connection-init-sql: SET hnsw.ef_search = 100
  ai:
    openai:
      base-url: http://litellm.jihun.com
      api-key: sk-jihun-master-1234
      chat:
        options:
          model: gpt-4o-mini
          stream-usage: true
      embedding:
        options:
          # 3-large + MRL 절단(dimensions). 3-large@1536 은 3-small@1536 보다 검색 품질이 높다.
          # 네이티브 3072 은 쓰지 않는다 — pgvector HNSW 인덱스 상한이 2000 차원이라 색인이 불가능하다.
          # dimensions 는 아래 vectorstore.pgvector.dimensions 와 반드시 같아야 한다.
          model: text-embedding-3-large
          dimensions: 1536
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: MyTechTestSiteAuth
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://keycloak.jihun.com/realms/MyTechTestSite
            user-name-attribute: preferred_username

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


